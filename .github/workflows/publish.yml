name: Publish to PyPI

# Trusted Publishing (OIDC): PyPI verifies this workflow's identity directly, so
# no API token is stored in the repository or in GitHub secrets. Configure the
# publisher once at https://pypi.org/manage/project/tepub/settings/publishing/
#   owner: xiaolai   repository: tepub
#   workflow: publish.yml   environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tepub shells out to ffmpeg for audio assembly, and one test exercises a
      # real mp4 round-trip. Without it that test skips and the audiobook path
      # goes unverified.
      # epubcheck validates the EPUBs the writer produces; without it the
      # round-trip tests skip and output validity goes unchecked.
      - name: Install ffmpeg and epubcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg epubcheck
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # The sentence-splitting tests need NLTK's Punkt tables. Tests never
      # download them (tests/conftest.py); without this step they would skip.
      - name: Install NLTK sentence data
        run: python -m nltk.downloader -d "$HOME/nltk_data" punkt_tab
      - name: Run tests
        run: python -m pytest --no-cov -q -rs
      # Gate on real errors only: F (undefined names, unused imports, dead code)
      # and E9 (syntax/IO). The repo carries pre-existing E501 line-length debt
      # across 56 sites; blocking a security release on that would mean the gate
      # never passes, which is worse than not having one.
      - name: Lint (blocking - real errors)
        run: ruff check src --select F,E9
      - name: Lint (advisory - full ruleset)
        run: ruff check src || true

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Verify the wheel installs and the CLI starts
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/tepub --help > /dev/null
          /tmp/smoke/bin/python -c "import importlib.metadata as m; print(m.version('tepub'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment gives you an approval gate and scopes the OIDC claim.
    environment:
      name: pypi
      url: https://pypi.org/p/tepub
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned to a commit: a tag can be moved to different code after review.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
